<style>

  P.pos[i].set(x,y,z);P.vel[i].set(vx,vy,vz);P.life[i]=P.max[i]=life;P.size[i]=size;

function burst(p,n,color,speed=8,size=1,life=.5,up=3){for(let i=0;i<n;i++){const a=rand(0,TAU),u=rand(-.3,1),s=speed*rand(.4,1);

function updateParticles(dt){if(pColDirty&&pMesh.instanceColor){pMesh.instanceColor.needsUpdate=true;pColDirty=false}
  for(let i=0;i<P_MAX;i++){if(P.life[i]<=0){_dm.scale.setScalar(0);_dm.position.set(0,-999,0);_dm.updateMatrix();pMesh.setMatrixAt(i,_dm.matrix);continue}
    P.life[i]-=dt;P.vel[i].y-=GRAV*.25*dt;P.pos[i].addScaledVector(P.vel[i],dt);
    const k=Math.max(P.life[i]/P.max[i],0);_dm.position.copy(P.pos[i]);_dm.scale.setScalar(P.size[i]*k);_dm.updateMatrix();pMesh.setMatrixAt(i,_dm.matrix)}
  pMesh.instanceMatrix.needsUpdate=true}

class Ball{
  constructor(roster,team,slot){this.roster=roster;this.team=team;this.slot=slot;
    this.mesh=makeBallMesh(roster);this.pos=new THREE.Vector3();this.vel=new THREE.Vector3();
    this.hp=100;this.maxHp=100;this.alive=true;this.abCd=rand(1.5,3);this.stunT=0;this.freezeT=0;this.tsT=0;
    this.flash=0;this.ice=null;this.trailT=0;this.aim={dir:new THREE.Vector3(1,0,0),power:18,locked:false};
    this.lastDir=new THREE.Vector3(1,0,0);
    this.boostT=0;this.slowT=0;this.chargeT=0;
    this.leech=null;scene.add(this.mesh)}
  reset(x,z){this.pos.set(x,BALL_R,z);this.vel.set(0,0,0);this.hp=this.maxHp;this.alive=true;
    this.abCd=rand(1.5,3);this.stunT=this.freezeT=this.tsT=this.flash=0;
    this.boostT=this.slowT=this.chargeT=0;
    this.lastDir.set(x>0?-1:1,0,0);
    this.mesh.visible=true;this.mesh.scale.setScalar(1);
    if(this.ice){this.mesh.remove(this.ice);this.ice=null}}
  get speed(){return Math.hypot(this.vel.x,this.vel.z)}
  update(dt){
    this.abCd-=dt;this.flash-=dt;this.boostT-=dt;this.slowT-=dt;
    if(G.state==='fight'&&this.alive&&this.roster.id==='charge')this.chargeT+=dt;
    if(this.tsT>0){this.tsT-=dt; /* время остановлено: шар висит в воздухе */ 
      if(this.tsT<=0)burst(this.pos,10,0xaabbee,5,.9,.4,2);
      this.mesh.position.copy(this.pos);return}
    if(this.freezeT>0){this.freezeT-=dt;this.vel.multiplyScalar(Math.exp(-10*dt));
      if(this.freezeT<=0&&this.ice){this.mesh.remove(this.ice);this.ice=null;burst(this.pos,14,0xbfefff,6,1,.4,2)}}
    else if(this.stunT>0)this.stunT-=dt;
    this.vel.y-=GRAV*dt;
    this.pos.addScaledVector(this.vel,dt);
    if(this.pos.y<BALL_R){this.pos.y=BALL_R;
      if(this.vel.y<-6){this.vel.y*=-.34}else this.vel.y=0}
    /* стены: чистое отражение без потери скорости */
    const axes=['x','z'];
    for(const ax of axes){
      if(Math.abs(this.pos[ax])>BOUND){
        this.pos[ax]=Math.sign(this.pos[ax])*BOUND;
        const vn=Math.abs(this.vel[ax]);
        this.vel[ax]*=-1;
        if(vn>3.5){SFX.bounce(clamp(vn/20,.3,1));burst(this.pos.clone().setY(1),Math.round(vn),0xffffff,4,.7,.3,1);
          triggerWall(this,new THREE.Vector3(ax==='x'?-Math.sign(this.pos.x):0,0,ax==='z'?-Math.sign(this.pos.z):0),this.pos.clone());}
      }}
    /* ПОСТОЯННАЯ СКОРОСТЬ: шары никогда не останавливаются (кроме заморозки и отсчёта) */
    let sp=this.speed;
    if(this.freezeT<=0&&(G.state==='fight'||G.state==='roundend')){
      if(sp<.75){ /* раскрутка из покоя */
        this.vel.x+=this.lastDir.x*46*dt;this.vel.z+=this.lastDir.z*46*dt;
      }else{
        const target=CRUISE*(this.boostT>0?1.9:1)*(this.slowT>0?.45:1);
        const k=damp(sp,target,5,dt)/sp; /* нокбэк затухает обратно к cruise */
        this.vel.x*=k;this.vel.z*=k;
        this.lastDir.set(this.vel.x,0,this.vel.z).normalize();
      }
    }
    sp=this.speed;
    this.trailT-=dt;
    if(sp>CRUISE+5&&this.trailT<=0){this.trailT=.03;spawnP(this.pos.x,this.pos.y,this.pos.z,0,0,0,.3,1.1,this.roster.color);pColDirty=true}
    const ei=this.flash>0?.85:.08;
    for(const m of this.mesh.userData.mats)m.emissiveIntensity=ei;
    this.mesh.position.copy(this.pos);
    if(sp>2){const yaw=Math.atan2(this.vel.x,this.vel.z);
      let df=yaw-this.mesh.rotation.y;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;
      this.mesh.rotation.y+=df*(1-Math.exp(-10*dt));}
    const An=this.mesh.userData.anims;
    if(An)for(const f of An)f(this,G.time,dt);

}

/* ================= ЭФФЕКТЫ / СПОСОБНОСТИ ================= */
const fx=[]; function addFx(o){fx.push(o);return o}
function clearFx(){for(const f of fx)if(f.dispose)f.dispose();fx.length=0}
function enemiesOf(b){return G.balls.filter(o=>o.team!==b.team&&o.alive)}
function nearestEnemy(b){let best=null,bd=1e9;for(const e of enemiesOf(b)){const d=e.pos.distanceTo(b.pos);if(d<bd){bd=d;best=e}}return best}
function applyHit(attacker,target,dmg,knock,opts={}){
  if(G.state!=='fight'||!target.alive)return;
  target.hp=Math.max(0,target.hp-dmg);
  if(knock)target.vel.add(knock);
  target.flash=.16;
  burst(target.pos,10,0xffdd55,7,1,.4,3);
  popup(target.pos,'-'+Math.round(dmg),target.team===0?'#ff8a80':'#ffffff');
  G.shake=Math.min(G.shake+dmg*.02,1.2);
  if(attacker)G.dmgDone[attacker.team]+=dmg;
  if(opts.stun){target.stunT=Math.max(target.stunT,opts.stun);burst(target.pos,10,0xffff88,5,.9,.6,4)}
  if(opts.freeze){target.freezeT=Math.max(target.freezeT,opts.freeze);
    if(!target.ice){target.ice=new THREE.Mesh(new THREE.BoxGeometry(2.7,2.7,2.7),
      new THREE.MeshStandardMaterial({color:0xbfefff,transparent:true,opacity:.42,roughness:.12}));
      target.ice.position.y=.2;target.mesh.add(target.ice)}
    SFX.freeze()}
  if(target.hp<=0){target.alive=false;target.mesh.visible=false;
    burst(target.pos,40,target.roster.color,14,1.6,.8,6);SFX.pop();
    roundWin(1-target.team,'нокаут!')}
}
/* --- триггеры способностей --- */
function triggerHit(b,foe){ if(b.roster.trig!=='on_hit'||b.abCd>0||!b.alive||!foe.alive)return;
  b.abCd=b.roster.cd; useAbility(b,foe) }
function triggerWall(b,normal,point){ if(b.roster.trig!=='on_wall'||b.abCd>0||!b.alive)return;
  b.abCd=b.roster.cd; useAbility(b,nearestEnemy(b),{normal,point}) }
function triggerTimer(b){ if(b.roster.trig!=='timer'||b.abCd>0||!b.alive||b.stunT>0||b.freezeT>0)return;
  const foe=nearestEnemy(b); if(!foe)return; b.abCd=b.roster.cd; useAbility(b,foe) }

function useAbility(b,foe,ctx={}){
  const id=b.roster.id; SFX.cast();
  const dirTo=(t)=>{const d=t.pos.clone().sub(b.pos);d.y=0;if(d.lengthSq()<.01)d.set(1,0,0);return d.normalize()};
  switch(id){
  case 'goku':{ const d=b.speed>4?b.vel.clone().setY(0).normalize():dirTo(foe); fxBeam(b,d,foe,{}); break }
  case 'vegeta':{ const d=b.speed>4?b.vel.clone().setY(0).normalize():dirTo(foe);
    fxBeam(b,d,foe,{radius:2.1,core:.9,color:0xffe14d,coreColor:0xfff9c4,dmg:18,knock:28,speed:26,life:1.8}); break }
  case 'glass':{ fxShardZone(b,ctx.point||b.pos.clone()); break }
  case 'laser':{ fxLaserLine(b,ctx.point||b.pos.clone(),ctx.normal||new THREE.Vector3(1,0,0)); break }
  case 'spider':{ fxWeb(b,ctx.point||b.pos.clone()); break }
  case 'portal':{ fxPortal(b); break }
  case 'mgun':{ fxBullets(b,foe); break }
  case 'cannon':{ fxCannon(b,foe); break }
  case 'kirby':{ fxInhale(b,foe); break }
  case 'sonic':{ fxSpinDash(b); break }
  case 'dice':{ fxDice(b,foe); break }
  case 'charge':{ const bonus=Math.min(b.chargeT*2,22); b.chargeT=0;
    if(bonus>2){SFX.boom();burst(b.pos,20,0xffab00,10,1.2,.5,3);
      applyHit(b,foe,bonus,new THREE.Vector3(dirTo(foe).x*8,4,dirTo(foe).z*8));} break }
  case 'naruto':{ SFX.boom(); burst(b.pos,24,0x88ccff,11,1.3,.5,4);
    applyHit(b,foe,12,new THREE.Vector3(dirTo(foe).x*10,11,dirTo(foe).z*10)); break }
  case 'luffy':{ fxFist(b,dirTo(foe),foe); break }
  case 'pikachu':{ fxThunder(b,foe); break }
  case 'todoroki':{ applyHit(b,foe,6,new THREE.Vector3(),{freeze:1.5}); burst(foe.pos,18,0xbfefff,8,1.1,.5,3); break }
  case 'saitama':{ fxShockwave(b,foe); break }
  case 'fujitora':{ fxGravity(b,foe); break }
  case 'bomber':{ fxMine(b,ctx.point||b.pos.clone()); break }
  case 'jade':{ fxBlink(b,foe); break }
  case 'crystal':{ fxShards(b,foe); break }
  case 'dio':{ fxLeech(b,foe); break }
  case 'jotaro':{ fxTimeStop(b,foe); break }
  }
}
/* --- луч Камехамехи --- */
function fxBeam(owner,dir,foe,opt={}){

  const g=new THREE.Group();

  const shell=new THREE.Mesh(new THREE.CylinderGeometry(O.radius,O.radius,3.6,20),new THREE.MeshBasicMaterial({color:O.color,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
  core.rotation.x=shell.rotation.x=Math.PI/2; g.add(core,shell);

    if(Math.abs(p.x)>BOUND){p.x=Math.sign(p.x)*BOUND;dir.x*=-1}
    if(Math.abs(p.z)>BOUND){p.z=Math.sign(p.z)*BOUND;dir.z*=-1}
    g.position.copy(p);g.rotation.y=Math.atan2(dir.x,dir.z);
    spawnP(p.x,p.y,p.z,rand(-2,2),rand(-1,2),rand(-2,2),.3,1,O.color);pColDirty=true;
    if(!this.hit&&foe.alive&&p.distanceTo(foe.pos)<BALL_R+O.radius+.4){this.hit=true;SFX.boom();
      burst(p,30,O.color,12,1.4,.6,4);applyHit(owner,foe,O.dmg,new THREE.Vector3(dir.x*O.knock,6,dir.z*O.knock))}

}
/* --- кулак Луффи --- */
function fxFist(owner,dir,foe){
  const fist=new THREE.Mesh(new THREE.SphereGeometry(1.35,24,18),new THREE.MeshStandardMaterial({color:0xc62828,roughness:.4}));
  fist.castShadow=true;
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,1,12),new THREE.MeshStandardMaterial({color:0xc62828,roughness:.5}));
  scene.add(fist,arm);
  arm.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  addFx({t:0,hit:false,update(dt){this.t+=dt;let ext;
    if(this.t<.14)ext=this.t/.14*9; else if(this.t<.24)ext=9; else if(this.t<.38)ext=9*(1-(this.t-.24)/.14); else{this.dead=true;return}
    const fp=owner.pos.clone().addScaledVector(dir,ext+1);fp.y=owner.pos.y;
    fist.position.copy(fp);arm.position.copy(owner.pos.clone().add(fp).multiplyScalar(.5));arm.scale.y=Math.max(.1,ext);

/* --- паутина: зона замедления --- */
function fxWeb(owner,point){
  const p=point.clone();p.x=clamp(p.x,-BOUND+1.5,BOUND-1.5);p.z=clamp(p.z,-BOUND+1.5,BOUND-1.5);
  const g=new THREE.Group();g.position.set(p.x,.1,p.z);
  const webMat=new THREE.MeshBasicMaterial({color:0xeeeeee,transparent:true,opacity:.65,depthWrite:false,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(new THREE.RingGeometry(2.8,3.0,28),webMat);ring.rotation.x=-Math.PI/2;g.add(ring);
  for(let i=0;i<6;i++){const a=i/6*TAU;
    const sp=new THREE.Mesh(new THREE.BoxGeometry(3,.02,.06),webMat);
    sp.rotation.y=a;sp.position.set(Math.cos(a)*1.5,0,Math.sin(a)*1.5);g.add(sp)}
  const disc=new THREE.Mesh(new THREE.CircleGeometry(3,28),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.14,depthWrite:false,side:THREE.DoubleSide}));
  disc.rotation.x=-Math.PI/2;g.add(disc);
  scene.add(g);SFX.cast();
  addFx({t:0,tick:0,update(dt){this.t+=dt;
    const foe=nearestEnemy(owner);
    if(foe&&foe.alive&&Math.hypot(foe.pos.x-p.x,foe.pos.z-p.z)<3){
      foe.slowT=Math.max(foe.slowT,.25);
      this.tick-=dt;if(this.tick<=0){this.tick=.6;applyHit(owner,foe,2,null)}}
    if(this.t>5)this.dead=true},dispose(){scene.remove(g)}});
}

/* --- пулемётная очередь --- */
function fxBullets(owner,foe){
  SFX.noise(.25,.4,2500,'highpass');
  addFx({t:0,n:0,update(dt){this.t+=dt;
    if(this.n<6&&this.t>this.n*.08){
      const i=this.n;this.n++;
      const d=foe.pos.clone().sub(owner.pos);d.y=0;
      d.x+=rand(-.14,.14)*d.length();d.z+=rand(-.14,.14)*d.length();d.normalize();
      const m=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),
        new THREE.MeshBasicMaterial({color:0xffe082,blending:THREE.AdditiveBlending,transparent:true}));
      scene.add(m);
      const p=owner.pos.clone().addScaledVector(d,1.5);p.y=1.1;
      addFx({t2:0,hit:false,update(d2){this.t2+=d2;p.addScaledVector(d,36*d2);m.position.copy(p);
        if(!this.hit&&foe.alive&&p.distanceTo(foe.pos)<BALL_R+.4){this.hit=true;
          applyHit(owner,foe,3,new THREE.Vector3(d.x*3,1,d.z*3));this.dead=true}
        if(this.t2>1.2||Math.abs(p.x)>BOUND||Math.abs(p.z)>BOUND)this.dead=true},dispose(){scene.remove(m)}});
    }
    if(this.n>=6&&this.t>1)this.dead=true},dispose(){}});
}
/* --- пушечное ядро --- */
function fxCannon(owner,foe){
  SFX.boom();
  const m=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),stdM(0x111111,{metalness:.4}));
  scene.add(m);
  const target=foe.pos.clone().addScaledVector(foe.vel,.35);
  const d=target.clone().sub(owner.pos);d.y=0;const dist=d.length();d.normalize();
  const p=owner.pos.clone().addScaledVector(d,1.4);p.y=1.4;
  const vel=new THREE.Vector3(d.x*14,9+dist*.35,d.z*14);
  addFx({t:0,update(dt){this.t+=dt;
    vel.y-=GRAV*.8*dt;p.addScaledVector(vel,dt);m.position.copy(p);
    m.rotation.x+=6*dt;
    if(p.y<=.5||this.t>3){this.dead=true;
      SFX.boom();G.shake=Math.min(G.shake+.6,1.4);burst(p,28,0xff9944,11,1.4,.6,4);
      if(foe.alive&&Math.hypot(foe.pos.x-p.x,foe.pos.z-p.z)<3.4){
        const n=foe.pos.clone().sub(p);n.y=0;if(n.lengthSq()<.01)n.set(1,0,0);n.normalize();
        applyHit(owner,foe,14,new THREE.Vector3(n.x*18,9,n.z*18))}}},dispose(){scene.remove(m)}});
}

function fxInhale(owner,foe){
  SFX.tone(200,600,.5,'sine',.35);
  addFx({t:0,done:false,update(dt){this.t+=dt;
    if(this.t<.8){if(foe.alive&&foe.freezeT<=0&&foe.tsT<=0){
        const n=owner.pos.clone().sub(foe.pos);n.y=0;
        if(n.length()>.5){n.normalize();foe.vel.addScaledVector(n,55*dt)}}
      spawnP(foe.pos.x,foe.pos.y,foe.pos.z,rand(-2,2),rand(0,3),rand(-2,2),.3,.8,0xf8bbd0);pColDirty=true}

      popup(owner.pos,'+8','#8dff6a');
      if(foe.alive){const n=foe.pos.clone().sub(owner.pos);n.y=0;

        applyHit(owner,foe,8,new THREE.Vector3(n.x*26,8,n.z*26))}}

/* --- рулетка Дайса --- */
function fxDice(owner,foe){
  const roll=Math.floor(Math.random()*6);
  popup(owner.pos,'🎲'+(roll+1),'#ffffff');
  SFX.coin();
  switch(roll){
    case 0:{ const n=foe.pos.clone().sub(owner.pos);n.y=0;if(n.lengthSq()<.01)n.set(1,0,0);n.normalize();
      SFX.boom();burst(owner.pos,26,0xff8844,12,1.4,.6,4);
      if(foe.alive&&foe.pos.distanceTo(owner.pos)<4.5)applyHit(owner,foe,14,new THREE.Vector3(n.x*22,8,n.z*22)); break }
    case 1: if(foe.alive)applyHit(owner,foe,4,null,{freeze:1.4}); break;
    case 2: if(foe.alive)fxThunder(owner,foe); break;
    case 3: if(foe.alive)fxShards(owner,foe); break;
    case 4: owner.hp=Math.min(owner.maxHp,owner.hp+18);popup(owner.pos,'+18','#8dff6a');burst(owner.pos,16,0x8dff6a,7,1,.5,3); break;
    case 5: if(foe.alive)fxBlink(owner,foe); break;
  }
}
/* --- ядовитый след Снейка --- */
function fxTrail(owner){
  const zones=[];
  addFx({t:0,update(dt){this.t+=dt;
    if(owner.alive&&G.state==='fight'){
      this.gen=(this.gen||0)-dt;
      if(this.gen<=0){this.gen=.4;
        if(zones.length<12){
          const disc=new THREE.Mesh(new THREE.CircleGeometry(1.3,18),
            new THREE.MeshBasicMaterial({color:0x9ccc65,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
          disc.rotation.x=-Math.PI/2;disc.position.set(owner.pos.x,.1,owner.pos.z);scene.add(disc);
          zones.push({p:owner.pos.clone(),t:2.6,tick:0,disc});
        }}}
    for(let i=zones.length-1;i>=0;i--){const z=zones[i];z.t-=dt;
      z.disc.material.opacity=Math.max(0,.4*z.t/2.6);
      const foe=nearestEnemy(owner);
      if(foe&&foe.alive&&Math.hypot(foe.pos.x-z.p.x,foe.pos.z-z.p.z)<1.4){
        z.tick-=dt;if(z.tick<=0){z.tick=.5;applyHit(owner,foe,3,null);
          popup(foe.pos,'☠','#9ccc65')}}
      if(z.t<=0){scene.remove(z.disc);zones.splice(i,1)}}
    if(this.t>60&&!zones.length)this.dead=true},
    dispose(){zones.forEach(z=>scene.remove(z.disc))}});
}
/* ================= СТОЛКНОВЕНИЯ ================= */
const _n=new THREE.Vector3();
function collideBalls(){
  for(let i=0;i<G.balls.length;i++)for(let j=i+1;j<G.balls.length;j++){
    const a=G.balls[i],b=G.balls[j];
    if(!a.alive||!b.alive||a.tsT>0||b.tsT>0)continue;
    _n.copy(b.pos).sub(a.pos);const d=_n.length(),minD=BALL_R*2;
    if(d<minD&&d>.0001){
      _n.divideScalar(d);
      const overlap=(minD-d)/2;
      a.pos.addScaledVector(_n,-overlap);b.pos.addScaledVector(_n,overlap);
      const rel=b.vel.clone().sub(a.vel),vn=rel.dot(_n);
      if(vn<0){const jimp=-(1+.9)*vn/2;
        a.vel.addScaledVector(_n,-jimp);b.vel.addScaledVector(_n,jimp);
        const approach=-vn;
        if(a.team!==b.team&&approach>5){
          const base=(approach-5)*1.15,sa=a.speed,sb=b.speed;
          const mid=a.pos.clone().add(b.pos).multiplyScalar(.5);
          burst(mid,12,0xffffff,8,1,.4,3);
          SFX.punch(clamp(approach/20,.4,1.4));
          G.shake=Math.min(G.shake+approach*.015,1.3);
          applyHit(b,a,Math.min(base*(.5+.5*sb/(sa+sb+.001)),32),null);
          applyHit(a,b,Math.min(base*(.5+.5*sa/(sa+sb+.001)),32),null);
          triggerHit(a,b);triggerHit(b,a);
        }
      }
    }
  }
}

/* ---------- траектория-прицел ---------- */
const dashes=[],DASH_N=44;
for(let i=0;i<DASH_N;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.34,.1,1.0),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.95}));
  m.visible=false;scene.add(m);dashes.push(m)}
const headCone=new THREE.Mesh(new THREE.ConeGeometry(.55,1.4,18),new THREE.MeshBasicMaterial({color:0xffffff}));
headCone.rotation.order='YXZ';headCone.rotation.x=Math.PI/2;headCone.visible=false;scene.add(headCone);
function simPath(start,dir,power){
  const pts=[new THREE.Vector2(start.x,start.z)];
  let px=start.x,pz=start.z,dx=dir.x,dz=dir.z,rem=power*1.35,bounces=0;
  while(rem>0&&bounces<=2){
    let t=1e9;
    if(dx>1e-6)t=Math.min(t,(BOUND-px)/dx);else if(dx<-1e-6)t=Math.min(t,(-BOUND-px)/dx);
    if(dz>1e-6)t=Math.min(t,(BOUND-pz)/dz);else if(dz<-1e-6)t=Math.min(t,(-BOUND-pz)/dz);
    if(t>rem){pts.push(new THREE.Vector2(px+dx*rem,pz+dz*rem));rem=0}
    else{px+=dx*t;pz+=dz*t;pts.push(new THREE.Vector2(px,pz));rem-=t;
      if(Math.abs(px)>BOUND-1e-4)dx*=-1;if(Math.abs(pz)>BOUND-1e-4)dz*=-1;bounces++}
  }
  return pts;
}
function drawPath(start,dir,power,color){
  const pts=simPath(start,dir,power);
  let seg=0,acc=.6,di=0;
  const put=(x,z,ang)=>{if(di>=DASH_N)return;const m=dashes[di++];m.visible=true;
    m.position.set(x,.35,z);m.rotation.y=ang;m.material.color.set(color)};
  for(let s=0;s<pts.length-1&&di<DASH_N;s++){
    let ax=pts[s].x,az=pts[s].y;const bx=pts[s+1].x,bz=pts[s+1].y;
    const sx=bx-ax,sz=bz-az,len=Math.hypot(sx,sz);if(len<1e-5)continue;
    const ux=sx/len,uz=sz/len,ang=Math.atan2(ux,uz);
    let d=acc;
    while(d<len&&di<DASH_N){put(ax+ux*d,az+uz*d,ang);d+=1.25}
    acc=d-len;
  }
  for(;di<DASH_N;di++)dashes[di].visible=false;
  const last=pts[pts.length-1],prev=pts[pts.length-2]||pts[0];
  headCone.visible=true;headCone.position.set(last.x,.4,last.y);
  headCone.rotation.y=Math.atan2(last.x-prev.x,last.y-prev.y);
  headCone.material.color.set(color);
}
function hidePath(){dashes.forEach(d=>d.visible=false);headCone.visible=false}

/* ---------- прицеливание игрока ---------- */
const mouseNDC=new THREE.Vector2(),raycaster=new THREE.Raycaster();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),aimPoint=new THREE.Vector3();
addEventListener('mousemove',e=>{mouseNDC.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1)});
function updateAimPreview(){
  const b=G.balls[G.aimIdx];if(!b)return;
  raycaster.setFromCamera(mouseNDC,camera);
  if(!raycaster.ray.intersectPlane(groundPlane,aimPoint))return;
  const d=aimPoint.clone().sub(b.pos);d.y=0;
  if(d.length()<.5)return;
  d.normalize();
  b.aim.dir.copy(d);b.aim.power=CRUISE;
  drawPath(b.pos,d,PREV_PW,0xffffff);
}

/* ---------- поток матча ---------- */
function startMatch(mode){
  G.mode=mode;G.hearts=[3,3];G.round=1;G.pickAnyUsed=false;G.matchCoins=0;G.dmgDone=[0,0];
  $('hud').classList.remove('hidden');$('screen-menu').classList.add('hidden');$('screen-end').classList.add('hidden');
  nextRound();
}
function nextRound(){
  G.balls.forEach(b=>scene.remove(b.mesh));G.balls=[];clearFx();hidePath();
  G.draftPickLeft=G.mode;G.offers=[];G.playerPicks=[];G.enemyPicks=[];
  G.state='draft';
  rollOffers();
  $('screen-draft').classList.remove('hidden');
}
function rollOffers(){
  const pool=SAVE.collection.slice();
  const off=[];
  while(off.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);off.push(pool.splice(i,1)[0])}
  G.offers=off;renderOffers();
}
function renderOffers(){
  $('draft-title').innerHTML=`РАУНД <span>${G.round}</span> — ВЫБЕРИ ШАР ${G.mode===2?`(${G.mode-G.draftPickLeft+1} из ${G.mode})`:''}`;
  const box=$('offers');box.innerHTML='';
  G.offers.forEach(id=>{
    const r=R_BY_ID[id],el=document.createElement('div');
    el.className='offer';el.style.setProperty('--c',r.css);el.style.setProperty('--rc',RAR[r.rar].c);
    el.innerHTML=`<div class="sw"></div><div class="nm">${r.name}</div><div class="rar">${RAR[r.rar].n}</div><div class="ab">${r.ability}</div><div class="ds">${r.desc}</div>`;
    el.onclick=()=>{SFX.ensure();SFX.click();playerPick(id)};
    box.appendChild(el);
  });
  $('btn-pickany').disabled=G.pickAnyUsed;
  $('btn-reroll').disabled=SAVE.coins<30;
  $('pickany-grid').classList.add('hidden');
}
function playerPick(id){
  G.playerPicks=(G.playerPicks||[]);G.playerPicks.push(id);
  G.draftPickLeft--;
  if(G.draftPickLeft>0){rollOffers();return}
  /* драфт врага */
  G.enemyPicks=[];
  for(let i=0;i<G.mode;i++)G.enemyPicks.push(ROSTER[Math.floor(Math.random()*ROSTER.length)].id);
  setupRound();
}
function setupRound(){
  const slots1=G.mode===1?[[ -5.5,0]]:[[-5.5,-3],[-5.5,3]];
  const slots2=G.mode===1?[[ 5.5,0]]:[[ 5.5,-3],[ 5.5,3]];
  G.balls=[];
  G.playerPicks.forEach((id,i)=>{const b=new Ball(R_BY_ID[id],0,i);b.reset(...slots1[i]);G.balls.push(b)});
  G.enemyPicks.forEach((id,i)=>{const b=new Ball(R_BY_ID[id],1,i);b.reset(...slots2[i]);G.balls.push(b)});
  G.aimIdx=0;G.state='aim';G.stateT=0;G.roundTimer=40;
  $('screen-draft').classList.add('hidden');
  buildHUD();
  $('lock-wrap').classList.remove('hidden');
  setHint('Наведи траекторию мышью и нажми Lock Aim!');
  $('phase').textContent='Твой прицел: шар '+(G.aimIdx+1);
  updateHUD();
}
function buildHUD(){
  for(const t of [0,1]){
    const bars=$(t===0?'bars-l':'bars-r');bars.innerHTML='';
    $(t===0?'hearts-l':'hearts-r').innerHTML='';
    G.balls.filter(b=>b.team===t).forEach((b,i)=>{
      const row=document.createElement('div');row.className='hprow';
      row.innerHTML=`<span class="nm">${b.roster.name}</span><div class="hpbar"><div class="hpfill hp${t}" id="hp-${t}-${i}"></div></div>`;
      bars.appendChild(row);
    });
  }
  renderHearts();
}
function renderHearts(){
  for(const t of [0,1]){
    const el=$(t===0?'hearts-l':'hearts-r');
    el.innerHTML=[0,1,2].map(i=>`<span class="h ${i<G.hearts[t]?'':'lost'}">♥</span>`).join('');
  }
}
function updateHUD(){
  for(const t of [0,1]){
    G.balls.filter(b=>b.team===t).forEach((b,i)=>{
      const el=$(`hp-${t}-${i}`);if(el)el.style.width=clamp(b.hp,0,100)+'%';
    });
  }
  $('timer').textContent=Math.ceil(G.roundTimer);
}
function setHint(t){$('hint').textContent=t}
function lockAim(){
  const b=G.balls[G.aimIdx];if(!b||b.aim.locked)return;
  b.aim.locked=true;SFX.lock();
  drawPath(b.pos,b.aim.dir,PREV_PW,0x8dff6a);
  G.aimIdx++;
  if(G.aimIdx<G.balls.filter(x=>x.team===0).length){
    $('phase').textContent='Твой прицел: шар '+(G.aimIdx+1);
    return;
  }
  $('lock-wrap').classList.add('hidden');
  G.state='enemyaim';G.stateT=rand(.9,1.6);
  setHint('Противник прицеливается...');
  $('phase').textContent='Прицел противника...';
}
function enemyAim(){
  for(const b of G.balls.filter(x=>x.team===1)){
    const targets=G.balls.filter(x=>x.team===0);
    const t=targets[Math.floor(Math.random()*targets.length)];
    const d=t.pos.clone().sub(b.pos);d.y=0;
    d.x+=rand(-.22,.22)*d.length();d.z+=rand(-.22,.22)*d.length();d.normalize();
    b.aim.dir.copy(d);b.aim.power=CRUISE;b.aim.locked=true;
  }
  /* показать вражеские траектории на миг */
  const eb=G.balls.find(x=>x.team===1);
  if(eb)drawPath(eb.pos,eb.aim.dir,PREV_PW,0xff8a80);
  G.state='count';G.stateT=3.2;G.countN=4;
  setHint('Поехали!');
}
function launch(){
  for(const b of G.balls){b.vel.set(b.aim.dir.x*CRUISE,0,b.aim.dir.z*CRUISE)}
  for(const b of G.balls)if(b.roster.id==='snake')fxTrail(b);
  hidePath();
  G.state='fight';G.roundTimer=40;
  $('timer').textContent='40';$('phase').textContent='';
  announce('БОЙ!');SFX.go();
  setHint('Авто-бой: способности сработают сами. Смотрим!');
}
function roundWin(team,how){
  if(G.state!=='fight')return;
  G.state='roundend';G.stateT=2.4;
  G.hearts[1-team]--;renderHearts();
  const winBalls=G.balls.filter(b=>b.team===team&&b.alive);
  if(winBalls[0]){winBalls[0].vel.y=9;winBalls[0].mesh.rotation.x=0}
  announce(team===0?'РАУНД ТВОЙ!':'РАУНД ЗА ВРАГОМ',how);
  if(team===0)SFX.win();else SFX.lose();
}
function afterRound(){
  if(G.hearts[0]<=0||G.hearts[1]<=0){matchEnd();return}
  G.round++;nextRound();
}
function matchEnd(){
  G.state='matchend';
  const won=G.hearts[0]>0;
  const perf=Math.round(G.dmgDone[0]/2);
  const coins=(won?100:40)+perf;
  SAVE.coins+=coins;G.matchCoins=coins;
  if(won)SAVE.wins++;
  save();
  $('end-title').textContent=won?'ПОБЕДА!':'ПОРАЖЕНИЕ';
  $('end-title').style.color=won?'#ffc233':'#ff8a80';
  $('end-sub').innerHTML=`Сердца ${G.hearts[0]} : ${G.hearts[1]} · урон ${Math.round(G.dmgDone[0])}<br>Заработано: <b style="color:#ffd76a">+${coins}🪙</b>`;
  $('screen-end').classList.remove('hidden');
  $('hud').classList.add('hidden');
  if(won)SFX.win();else SFX.lose();
  if(won)SFX.coin();
}

/* ================= ДРАФТ UI ================= */
$('btn-reroll').onclick=()=>{SFX.ensure();if(SAVE.coins<30)return;SAVE.coins-=30;save();SFX.coin();rollOffers();refreshMenu()};
$('btn-pickany').onclick=()=>{SFX.ensure();SFX.click();
  const g=$('pickany-grid');
  if(!g.classList.contains('hidden')){g.classList.add('hidden');return}
  g.classList.remove('hidden');g.innerHTML='';
  SAVE.collection.forEach(id=>{const r=R_BY_ID[id],el=document.createElement('div');
    el.className='offer';el.style.width='96px';el.style.setProperty('--c',r.css);el.style.setProperty('--rc',RAR[r.rar].c);
    el.innerHTML=`<div class="sw" style="width:44px;height:44px"></div><div class="nm" style="font-size:11px">${r.name}</div>`;
    el.onclick=()=>{G.pickAnyUsed=true;SFX.click();playerPick(id)};
    g.appendChild(el)});
};
function refreshMenu(){
  $('coins-line').textContent='🪙 '+SAVE.coins+' · побед: '+SAVE.wins;
  const g=$('coll-grid');g.innerHTML='';
  ROSTER.forEach(r=>{
    const owned=SAVE.collection.includes(r.id);
    const el=document.createElement('div');
    el.className='coll'+(owned?'':' locked');
    el.style.setProperty('--c',owned?r.css:'#333');
    el.style.setProperty('--rc',RAR[r.rar].c);
    el.title=owned?`${r.name} — ${r.ability}`:'???';
    el.innerHTML=(owned?'':'?')+`<span class="rar">${RAR[r.rar].n[0]}</span>`;
    g.appendChild(el);
  });
  $('btn-gacha').disabled=SAVE.coins<150;
}
$('btn-gacha').onclick=()=>{SFX.ensure();if(SAVE.coins<150)return;
  SAVE.coins-=150;
  const unowned=ROSTER.filter(r=>!SAVE.collection.includes(r.id));
  if(!unowned.length){SAVE.coins+=150;announce('ВСЁ СОБРАНО!')}
  else{
    let total=0;for(const k in RAR)total+=RAR[k].w;
    let roll=Math.random()*total,pick=null;
    for(const k in RAR){if(roll<RAR[k].w){pick=k;break}roll-=RAR[k].w}
    let cands=unowned.filter(r=>r.rar===pick);
    if(!cands.length)cands=unowned;
    const got=cands[Math.floor(Math.random()*cands.length)];
    SAVE.collection.push(got.id);
    SFX.coin();announce('НОВЫЙ ШАР!',got.name+' ('+RAR[got.rar].n+')');
  }
  save();refreshMenu();
};
$('btn-1v1').onclick=()=>{SFX.ensure();SFX.click();startMatch(1)};
$('btn-2v2').onclick=()=>{SFX.ensure();SFX.click();startMatch(2)};
$('btn-lock').onclick=()=>{SFX.ensure();lockAim()};
$('btn-rematch').onclick=()=>{SFX.ensure();SFX.click();startMatch(G.mode)};
$('btn-menu').onclick=()=>{SFX.ensure();SFX.click();
  $('screen-end').classList.add('hidden');$('hud').classList.add('hidden');
  $('screen-menu').classList.remove('hidden');
  G.balls.forEach(b=>scene.remove(b.mesh));G.balls=[];clearFx();hidePath();
  G.state='menu';refreshMenu()};
addEventListener('keydown',e=>{SFX.ensure();
  if(G.state==='aim'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();lockAim()}});
addEventListener('mousedown',()=>SFX.ensure());

/* ================= ЦИКЛ ================= */
const clock=new THREE.Clock();
const camTarget=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  G.time+=dt;

  if(G.state==='menu'){
    const a=G.time*.16;
    camera.position.set(Math.sin(a)*22,12,Math.cos(a)*22);
    camera.lookAt(0,1,0);
  }
  if(G.state==='draft'){
    camera.position.lerp(new THREE.Vector3(0,22,15),1-Math.exp(-3*dt));
    camera.lookAt(0,0,0);
  }
  if(G.state==='aim'){updateAimPreview()}
  if(G.state==='enemyaim'){
    G.stateT-=dt;
    if(G.stateT<=0)enemyAim();
  }
  if(G.state==='count'){
    G.stateT-=dt;
    const n=Math.ceil(G.stateT-.2);
    if(n!==G.countN&&n>=0){G.countN=n;
      if(n>0){announce(String(n));SFX.count()}else launch()}
    if(G.state!=='fight')G.balls.forEach(b=>b.update(dt));
  }
  if(G.state==='fight'){
    G.roundTimer-=dt;
    for(const b of G.balls){
      if(b.alive&&b.tsT<=0){
        if(b.roster.trig==='timer')triggerTimer(b);
      }
    }
    G.balls.forEach(b=>{if(b.alive)b.update(dt)});
    collideBalls();
    if(G.roundTimer<=0&&G.state==='fight'){
      const hp=t=>{const bs=G.balls.filter(b=>b.team===t);return bs.reduce((s,b)=>s+b.hp/b.maxHp,0)/Math.max(1,bs.length)};
      roundWin(hp(0)>=hp(1)?0:1,'время вышло!');
    }
    updateHUD();
  }
  if(G.state==='roundend'){
    G.stateT-=dt;
    G.balls.forEach(b=>{if(b.alive)b.update(dt)});
    collideBalls();
    if(G.stateT<=0)afterRound();
  }
  /* эффекты */
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.update(dt);if(f.dead){if(f.dispose)f.dispose();fx.splice(i,1)}}
  updateParticles(dt);updatePopups(dt);
  /* камера боя */
  if(G.state==='aim'||G.state==='enemyaim'||G.state==='count'||G.state==='fight'||G.state==='roundend'){
    const alive=G.balls.filter(b=>b.alive);
    const mid=new THREE.Vector3();
    (alive.length?alive:G.balls).forEach(b=>mid.add(b.pos));
    mid.divideScalar(Math.max(1,(alive.length||G.balls.length)));
    camTarget.lerp(mid,1-Math.exp(-4*dt));
    const want=G.state==='aim'
      ? camTarget.clone().add(new THREE.Vector3(0,19.5,12.5))
      : camTarget.clone().add(new THREE.Vector3(0,14.5,11.5));
    camera.position.lerp(want,1-Math.exp(-3.5*dt));
    if(G.shake>.001){camera.position.x+=rand(-1,1)*G.shake*.3;camera.position.y+=rand(-1,1)*G.shake*.3;G.shake*=Math.exp(-5*dt)}
    camera.lookAt(camTarget.x,camTarget.y+1,camTarget.z);
  }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
refreshMenu();
tick();
</script>
